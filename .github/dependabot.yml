# Dependabot: monthly, minor/patch only, one grouped PR per directory.
# Major upgrades are intentionally ignored - do them manually and test the build.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/studio"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      studio-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
