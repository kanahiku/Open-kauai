name: Sanity Backup

# OPTIONAL: runs weekly, but skips cleanly (green) if S3/Sanity secrets are not set.

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday 2 AM UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # `secrets` is not allowed in `if:` - expose via env and check env.* instead
      HAS_BACKUP_CONFIG: ${{ secrets.S3_BUCKET != '' && secrets.SANITY_PROJECT_ID != '' && secrets.SANITY_API_TOKEN != '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Skip - backup secrets not configured
        if: env.HAS_BACKUP_CONFIG != 'true'
        run: |
          echo "Sanity backup skipped: required secrets are not set."
          echo "Add: SANITY_PROJECT_ID, SANITY_API_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET"
          echo "Optional: SANITY_DATASET (default production), S3_REGION (default us-east-1)"
          echo "Also set SITE_FOLDER and SANITY_PROJECT_LOCK in scripts/sanity-export.ts."
          echo "The script refuses any other project or site folder."
          echo "Manual backup: npm run sanity:export"

      - uses: actions/checkout@v4
        if: env.HAS_BACKUP_CONFIG == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_BACKUP_CONFIG == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: env.HAS_BACKUP_CONFIG == 'true'
        run: npm ci

      - name: Configure AWS credentials
        if: env.HAS_BACKUP_CONFIG == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.S3_REGION || 'us-east-1' }}

      - name: Export Sanity and upload to S3
        if: env.HAS_BACKUP_CONFIG == 'true'
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION || 'us-east-1' }}
        run: npx tsx scripts/sanity-export.ts --s3 --delete-local
